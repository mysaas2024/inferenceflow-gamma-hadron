global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "node-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["node-api:7000"]

  - job_name: "python-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["python-worker:8000"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]
