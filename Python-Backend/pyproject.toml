[project]
name = "python-backend"
version = "0.1.0"
description = "Simple RabbitMQ-powered FastAPI inference worker without ONNX"
readme = "README.md"
authors = [
    { name = "mysaas2024", email = "mysaas2024@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pika>=1.3.2",
    "prometheus-client>=0.20.0",
]

[project.scripts]
python-backend = "python_backend.main:app"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
